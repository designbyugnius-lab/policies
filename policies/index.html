<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Privacy Policies</title>
<meta name="description" content="Privacy policies for browser extensions.">
<style>
  :root {
    --bg: #ffffff;
    --surface: #f1f5fc;
    --ink: #16181d;
    --muted: #5b6270;
    --line: #dfe4ec;
    --accent: #2856c9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161a; --surface: #1b1f26; --ink: #eceef1;
      --muted: #9aa1ab; --line: #2a2f36; --accent: #7aa2fb;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161a; --surface: #1b1f26; --ink: #eceef1;
    --muted: #9aa1ab; --line: #2a2f36; --accent: #7aa2fb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.6 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding-inline: 16px;
  }
  .wrap { max-width: 620px; margin-inline: auto; padding-block: 64px 80px; }
  h1 { font-size: 28px; letter-spacing: -0.02em; margin: 0 0 8px; }
  .sub { color: var(--muted); margin: 0 0 32px; }
  ul { list-style: none; padding: 0; margin: 0; display: flex;
       flex-direction: column; gap: 10px; }
  a.item {
    display: block;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px 18px;
    text-decoration: none;
    color: inherit;
  }
  a.item:hover { border-color: var(--accent); }
  a.item:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .name { font-weight: 600; color: var(--accent); }
  .what { color: var(--muted); font-size: 15px; margin-top: 2px; }
  footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line);
           color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Privacy policies</h1>
    <p class="sub">Privacy policies for browser extensions published by this
    developer.</p>

    <ul>
      <li>
        <a class="item" href="tab-sessions/">
          <span class="name">Tab Sessions</span>
          <div class="what">Chrome extension — save and restore windows and
          tab groups. No server, no account, no network requests.</div>
        </a>
      </li>
    </ul>

    <footer>
      Each policy describes only the extension it names.
    </footer>
  </div>
</body>
</html>
